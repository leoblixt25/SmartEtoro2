services:
  - type: web
    name: copyvault-backend
    env: docker
    dockerfilePath: ./docker/Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./etoro_platform.db
      - key: ETORO_API_KEY
        sync: false
      - key: ETORO_API_SECRET
        sync: false
      - key: ETORO_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://smart-etoro2.vercel.app
      - key: APP_ENV
        value: production
