services:
  - type: web
    name: copyvault-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ETORO_API_KEY
        sync: false
      - key: ETORO_API_SECRET
        sync: false
      - key: ETORO_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://smart-etoro2.vercel.app
      - key: DATABASE_URL
        value: postgresql://postgres:qr7x1tXyckTETURZ@db.qnxfbnckivdhnrfqttmd.supabase.co:5432/postgres
      - key: APP_ENV
        value: production
